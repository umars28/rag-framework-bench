[project]
name = "rag-framework-bench"
version = "0.1.0"
description = "One retrieval task implemented three ways (no framework, LangChain, LlamaIndex) and scored on the same labelled query set."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umar Sabirin" }]
dependencies = [
    "numpy>=1.26",
    "packaging>=23",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
baseline = [
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
]
langchain = [
    "langchain-core>=1.0",
    "langchain-classic>=1.0",
    "langchain-community>=0.4",
    "langchain-huggingface>=1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3",
]
llamaindex = [
    "llama-index-core>=0.12",
    "llama-index-retrievers-bm25>=0.5",
    "llama-index-embeddings-huggingface>=0.5",
    "sentence-transformers>=3.3",
]
tracing = [
    "langfuse>=3.0",
    "langsmith>=0.3",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: loads the real embedding or reranking model"]
addopts = "-m 'not models'"
